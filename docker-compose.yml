version: '3.8'

# ============================================================================
# SIM-IBU Docker Compose Configuration (Default: App + MySQL)
# ============================================================================

services:
  # 1. Service Utama: Aplikasi Node.js SIM-IBU
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sim-ibu-app
    restart: always
    ports:
      - "3000:3000"
    # Mengimpor semua variabel lingkungan secara otomatis dari berkas .env
    env_file:
      - .env
    # Melakukan override khusus untuk variabel yang berbeda di lingkungan Docker
    environment:
      - DB_HOST=db                            # Menunjuk ke nama service database 'db' di jaringan internal Docker
    depends_on:
      db:
        condition: service_healthy            # Memastikan database mysql sudah siap menerima koneksi sebelum app berjalan
    volumes:
      # Bind mount untuk konfigurasi identitas sekolah & koordinat pencadangan otomatis Google Sheets
      - ./school_identity.json:/app/school_identity.json
    networks:
      - sim-ibu-net

  # 2. Service Database: MySQL Server 8.0
  db:
    image: mysql:8.0
    container_name: sim-ibu-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-your_secure_root_password}
      MYSQL_DATABASE: ${DB_NAME:-sigup_db}
      MYSQL_USER: ${DB_USER:-sim_ibu_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-your_secure_db_password}
    # Membatasi port database hanya ke localhost (127.0.0.1) demi keamanan agar tidak bisa diakses langsung dari internet.
    # Jika Anda ingin database terisolasi total di dalam jaringan Docker, Anda dapat menghapus atau menonaktifkan blok ports di bawah ini.
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sim-ibu-net

# Volume persisten untuk menjamin data MySQL tidak hilang saat container mati/direstart
volumes:
  mysql_data:

# Network terisolasi untuk komunikasi aman antar container
networks:
  sim-ibu-net:
    driver: bridge

# ============================================================================
# PETUNJUK DEPLOYMENT DENGAN SQLITE:
# Jika ingin mendeploy HANYA menggunakan SQLite lokal tanpa database server MySQL,
# Anda dapat menggunakan file konfigurasi "docker-compose.sqlite.yml" dengan perintah:
#
#   docker compose -f docker-compose.sqlite.yml up -d
#
# Selengkapnya silakan baca dokumentasi di DEPLOYMENT.md!
# ============================================================================
