version: '3.8'

# ============================================================================
# SIM-IBU Docker Compose Configuration (SQLite Engine - Single Container)
# ============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sim-ibu-app-sqlite
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DB_TYPE=sqlite
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-admin123}
      - DEFAULT_GURU_PASSWORD=${DEFAULT_GURU_PASSWORD:-guru123}
      - DEFAULT_ORTU_PASSWORD=${DEFAULT_ORTU_PASSWORD:-ortu123}
      - COOKIE_PASSWORD=${COOKIE_PASSWORD}
      - APP_ENV=${APP_ENV:-dev}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      # Bind mount atau Named Volume untuk memastikan database SQLite sekolah.db tersimpan persisten di host
      - ./server/data:/app/server/data
