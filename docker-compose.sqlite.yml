version: '3.8'

# ============================================================================
# SIM-IBU Docker Compose Configuration (SQLite Engine - Single Container)
# ============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sim-ibu-app-sqlite
    restart: always
    ports:
      - "3000:3000"
    # Mengimpor semua variabel lingkungan secara otomatis dari berkas .env
    env_file:
      - .env
    # Melakukan override khusus untuk memastikan engine SQLite yang aktif
    environment:
      - DB_TYPE=sqlite
    volumes:
      # Bind mount atau Named Volume untuk memastikan database SQLite sekolah.db tersimpan persisten di host
      - ./server/data:/app/server/data
      # Bind mount untuk konfigurasi identitas sekolah & koordinat pencadangan otomatis Google Sheets
      - ./school_identity.json:/app/school_identity.json
